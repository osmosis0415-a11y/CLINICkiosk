​// ==========================================
// SINGLETON AUDIO CONTEXT (PREVENTS MOBILE BROWSER CRASH)
// ==========================================
let sharedAudioCtx = null;
const getSharedAudioContext = () => {
try {
if (!sharedAudioCtx) {
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
if (AudioContextClass) {
sharedAudioCtx = new AudioContextClass();
}
}
if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
sharedAudioCtx.resume().catch(() => {});
}
return sharedAudioCtx;
} catch (e) {
return null;
}
};
​const playAudioChime = (type) => {
try {
const ctx = getSharedAudioContext();
if (!ctx) return;
​if (type === 'tap') {
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(600, ctx.currentTime);
gain.gain.setValueAtTime(0.04, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 0.05);
} else if (type === 'success') {
const osc1 = ctx.createOscillator();
const osc2 = ctx.createOscillator();
const gain = ctx.createGain();
osc1.type = 'triangle';
osc2.type = 'sine';
osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
osc1.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.08);
osc1.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2);
osc2.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.08);
gain.gain.setValueAtTime(0.18, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
osc1.connect(gain);
osc2.connect(gain);
gain.connect(ctx.destination);
osc1.start();
osc2.start();
osc1.stop(ctx.currentTime + 0.35);
osc2.stop(ctx.currentTime + 0.35);
} else if (type === 'error') {
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(240, ctx.currentTime);
osc.frequency.setValueAtTime(160, ctx.currentTime + 0.12);
gain.gain.setValueAtTime(0.2, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 0.3);
}
} catch (e) {
console.warn("Audio chime prevented:", e);
}
};
​const triggerHaptic = (pattern = [40]) => {
if (typeof window !== 'undefined' && window.navigator && window.navigator.vibrate) {
try { window.navigator.vibrate(pattern); } catch (e) {}

};
​const getTodayDateStr = () => new Date().toISOString().split('T')[0];
​const calculateTimeDiffHours = (timeInStr, timeOutStr) => {
try {
if (!timeInStr || !timeOutStr || timeOutStr === 'Pending') return 0;
const parseTime = (str) => {
const match = str.match(/(\d+):(\d+)\s*(AM|PM)/i);
if (!match) return null;
let hours = parseInt(match[1], 10);
const minutes = parseInt(match[2], 10);
const period = match[3].toUpperCase();
if (period === 'PM' && hours < 12) hours += 12;
if (period === 'AM' && hours === 12) hours = 0;
return hours + minutes / 60;
};
const inH = parseTime(timeInStr);
const outH = parseTime(timeOutStr);
if (inH === null || outH === null) return 0;
let diff = outH - inH;
if (diff < 0) diff += 24;
return Math.round(diff * 10) / 10;
} catch (e) {
return 0;
}
};
​// Safe LocalStorage Wrapper
const safeStorageGet = (key, fallback) => {
try {
const item = localStorage.getItem(key);
return item ? JSON.parse(item) : fallback;
} catch (e) {
return fallback;
}
};
​const safeStorageSet = (key, value) => {
try {
localStorage.setItem(key, JSON.stringify(value));
} catch (e) {
console.warn("LocalStorage write prevented:", e);
}
};

// COMPONENT 1: ON-DEMAND KIOSK (BACKGROUND CAMERA + PIN)

function OnDemandKioskSection({ staffList, attendanceLogs, setAttendanceLogs, clinicSettings, showToast }) {
const [pinInput, setPinInput] = useState('');
const [isCameraActive, setIsCameraActive] = useState(false);
const [cameraError, setCameraError] = useState(null);
const [lastPunchSuccess, setLastPunchSuccess] = useState(null);
const [isProcessing, setIsProcessing] = useState(false);
​const videoRef = useRef(null);
const canvasRef = useRef(null);
const mediaStreamRef = useRef(null);
const idleTimerRef = useRef(null);
​const stopCamera = useCallback(() => {
if (mediaStreamRef.current) {
try {
mediaStreamRef.current.getTracks().forEach(track => track.stop());
} catch (e) {}
mediaStreamRef.current = null;
}
if (videoRef.current) videoRef.current.srcObject = null;
setIsCameraActive(false);
}, []);
​const startCamera = useCallback(async () => {
if (mediaStreamRef.current) return true;
try {
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
setCameraError("Camera unavailable on HTTP/Browser context.");
setIsCameraActive(false);
return false;
}
const stream = await navigator.mediaDevices.getUserMedia({
video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
audio: false
});
mediaStreamRef.current = stream;
if (videoRef.current) {
videoRef.current.srcObject = stream;
try {
await videoRef.current.play();
} catch (playErr) {
console.warn("Autoplay deferred:", playErr);
}
}
setIsCameraActive(true);
setCameraError(null);
return true;
} catch (err) {
console.warn("Camera access error:", err);
setCameraError("Camera permission blocked or in use.");
setIsCameraActive(false);
return false;
}
}, []);
​const resetIdleTimer = useCallback(() => {
if (idleTimerRef.current) clearTimeout(idleTimerRef.current);
idleTimerRef.current = setTimeout(() => {
stopCamera();
}, 15000);
}, [stopCamera]);
​useEffect(() => {
startCamera();
resetIdleTimer();
return () => {
stopCamera();
if (idleTimerRef.current) clearTimeout(idleTimerRef.current);
};
}, [startCamera, resetIdleTimer, stopCamera]);
​const captureSnapshot = () => {
if (!videoRef.current || !canvasRef.current || !isCameraActive) {
return "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250";
}
try {
const video = videoRef.current;
const canvas = canvasRef.current;
if (!video.videoWidth || !video.videoHeight) {
return "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250";
}
canvas.width = video.videoWidth || 320;
canvas.height = video.videoHeight || 240;
const ctx = canvas.getContext('2d');
ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
return canvas.toDataURL('image/jpeg', 0.85);
} catch (e) {
return "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250";
}
};
​const handleKeyPress = async (val) => {
playAudioChime('tap');
triggerHaptic([30]);
resetIdleTimer();
​if (!isCameraActive) startCamera();
​if (val === 'CLEAR') {
setPinInput('');
return;
}
​if (pinInput.length >= 4 || isProcessing) return;
​const nextPin = pinInput + val;
setPinInput(nextPin);
​if (nextPin.length === 4) {
setIsProcessing(true);
const matchedStaff = staffList.find(s => s.pin === nextPin);
​setTimeout(() => {
if (matchedStaff) {
const auditSnapshot = captureSnapshot();
const todayStr = getTodayDateStr();
const now = new Date();
const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
​const existingLogIndex = attendanceLogs.findIndex(l => l.staffId === matchedStaff.id && l.date === todayStr && l.timeOut === 'Pending');
​if (existingLogIndex >= 0) {
// Punch OUT
const updatedLogs = [...attendanceLogs];
const timeIn = updatedLogs[existingLogIndex].timeIn;
const hoursWorked = calculateTimeDiffHours(timeIn, timeStr);
​updatedLogs[existingLogIndex] = {
...updatedLogs[existingLogIndex],
timeOut: timeStr,
hoursWorked: hoursWorked,
auditPhoto: auditSnapshot
};
​setAttendanceLogs(updatedLogs);
playAudioChime('success');
setLastPunchSuccess({
type: 'PUNCH OUT',
staffName: matchedStaff.name,
role: matchedStaff.role,
time: timeStr,
hours: hoursWorked,
photo: auditSnapshot
});
showToast(Goodbye ${matchedStaff.name}! Punch-OUT recorded (${hoursWorked} hrs).);
} else {
// Punch IN
const newLog = {
id: 'LOG-' + Math.floor(1000 + Math.random() * 9000),
staffId: matchedStaff.id,
staffName: matchedStaff.name,
department: matchedStaff.department,
timeIn: timeStr,
timeOut: 'Pending',
date: todayStr,
type: 'IN',
verificationMethod: 'PIN + Silent Photo Audit',
status: 'Punctual',
hoursWorked: 0,
auditPhoto: auditSnapshot
};
​setAttendanceLogs([newLog, ...attendanceLogs]);
playAudioChime('success');
setLastPunchSuccess({
type: 'PUNCH IN',
staffName: matchedStaff.name,
role: matchedStaff.role,
time: timeStr,
hours: 0,
photo: auditSnapshot
});
showToast(Welcome ${matchedStaff.name}! Punch-IN recorded.);
}
} else {
playAudioChime('error');
triggerHaptic([100, 50, 100]);
showToast('Invalid PIN Code. Please try again.', 'error');
}
​setPinInput('');
setIsProcessing(false);
}, 300);
}
};
​return (
<div className="max-w-md mx-auto space-y-6 animate-scale-in">
​{/* SILENT HIDDEN CAMERA & CANVAS */}
<div className="hidden">
<video ref={videoRef} autoPlay playsInline muted className="w-0 h-0 opacity-0"></video>
<canvas ref={canvasRef} className="w-0 h-0 opacity-0"></canvas>
</div>
​{/* KIOSK HEADER CARD */}
<div className="glass-card rounded-3xl p-6 shadow-2xl text-center space-y-3 relative overflow-hidden animate-pulse-glow">
<div className="w-16 h-16 rounded-3xl bg-gradient-to-br from-clinic-500/20 to-emerald-500/10 border border-clinic-400/40 text-clinic-400 flex items-center justify-center text-3xl mx-auto shadow-inner">
<i className="fa-solid fa-fingerprint"></i>
</div>
​<div>

</div>
​{/* Verification Status */}
<div className="pt-1 flex justify-center items-center gap-2">

{isCameraActive ? 'Audit Photo Verification Armed' : 'Camera On Standby'}
</span>
</div>
</div>
​{/* 4-DIGIT PIN DISPLAY & KEYPAD */}
<div className="glass-card rounded-3xl p-6 shadow-2xl space-y-5 text-center border border-gray-800/90">

{[0, 1, 2, 3].map(idx => (
<div
key={idx}
className={w-12 h-14 sm:w-14 sm:h-16 rounded-2xl border-2 flex items-center justify-center text-2xl font-mono font-black transition-all duration-200 ${ pinInput.length > idx ? 'border-clinic-400 bg-clinic-500/15 text-clinic-300 shadow-lg shadow-clinic-500/25 scale-105' : 'border-gray-800 bg-gray-950/80 text-gray-700' }}
>
{pinInput.length > idx ? '•' : ''}
</div>
))}
</div>

<div className="grid grid-cols-3 gap-3.5 pt-1">

​{/* SUCCESS AUDIT FEEDBACK CARD */}
{lastPunchSuccess && (

)}

}

function OpdQueueSection({ patientQueue, setPatientQueue, staffList, clinicSettings, showToast }) {
const [patientName, setPatientName] = useState('');
const [phone, setPhone] = useState('');
const [selectedDoctor, setSelectedDoctor] = useState(staffList[0]?.name || clinicSettings.doctorName);
const [purpose, setPurpose] = useState('General Consultation');
​const doctors = useMemo(() => {
const docList = staffList.filter(s => s.department === 'Medical OPD' || (s.role && s.role.toLowerCase().includes('doctor')) || (s.name && s.name.startsWith('Dr.')));
return docList.length > 0 ? docList.map(d => d.name) : [clinicSettings.doctorName];
}, [staffList, clinicSettings]);
​const currentInRoom = useMemo(() => patientQueue.find(q => q.status === 'In Doctor Room'), [patientQueue]);
const nextWaiting = useMemo(() => patientQueue.find(q => q.status === 'Waiting'), [patientQueue]);
const waitingCount = useMemo(() => patientQueue.filter(q => q.status === 'Waiting').length, [patientQueue]);
​const handleIssueToken = (e) => {
e.preventDefault();
if (!patientName.trim()) {
showToast('Please enter patient name', 'error');
return;
}
​const maxToken = patientQueue.reduce((max, item) => item.tokenNo > max ? item.tokenNo : max, 0);
const nextTokenNo = maxToken + 1;
const now = new Date();
const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
​const newToken = {
id: 'TK-' + Math.floor(1000 + Math.random() * 9000),
tokenNo: nextTokenNo,
patientName: patientName.trim(),
phone: phone.replace(/\D/g, ''),
doctorName: selectedDoctor,
purpose: purpose,
status: 'Waiting',
time: timeStr
};
​setPatientQueue([...patientQueue, newToken]);
setPatientName('');
setPhone('');
playAudioChime('success');
showToast(Token #${nextTokenNo} issued to ${newToken.patientName});
};
​const handleCallNext = () => {
if (!nextWaiting) {
showToast('No patients currently waiting in queue.', 'error');
return;
}
​const updated = patientQueue.map(item => {
if (item.status === 'In Doctor Room') return { ...item, status: 'Completed' };
if (item.id === nextWaiting.id) return { ...item, status: 'In Doctor Room' };
return item;
});
​setPatientQueue(updated);
playAudioChime('success');
​if ('speechSynthesis' in window) {
try {
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(Token Number ${nextWaiting.tokenNo}, ${nextWaiting.patientName}, please proceed to doctor room.);
utterance.rate = 0.9;
window.speechSynthesis.speak(utterance);
} catch(e) {}
}
​showToast(Calling Token #${nextWaiting.tokenNo}: ${nextWaiting.patientName});
};
​const handleStatusChange = (id, newStatus) => {
setPatientQueue(patientQueue.map(q => q.id === id ? { ...q, status: newStatus } : q));
showToast(Token status updated to ${newStatus});
};
​const handleClearCompleted = () => {
setPatientQueue(patientQueue.filter(q => q.status !== 'Completed'));
showToast('Cleared completed tokens from view.');
};
​const sendWhatsAppMsg = (recipientPhone, textMessage) => {
if (!recipientPhone) {
showToast('No phone number attached to this patient.', 'error');
return;
}
​let cleanNo = recipientPhone.replace(/\D/g, '');
if (cleanNo.length === 10) cleanNo = '91' + cleanNo;
​const encodedText = encodeURIComponent(textMessage);
const waUrl = https://wa.me/${cleanNo}?text=${encodedText};
window.open(waUrl, '_blank');
showToast('Opening free WhatsApp chat link...');
};
​return (
<div className="space-y-6 animate-scale-in">

100% Free WhatsApp Communication Engine
</span>

function PayrollSection({ staffList, attendanceLogs, clinicSettings, exportPayrollExcel, onOpenPayslip }) {
const payrollData = useMemo(() => {
return staffList.map(staff => {
const punches = attendanceLogs.filter(l => l.staffId === staff.id);
const daysPresent = punches.length;
const latePunches = punches.filter(p => p.status === 'Late Arrival').length;
​const totalDays = 26;
const baseSal = staff.baseSalary || 0;
const dailyRate = Math.round(baseSal / totalDays);
const grossEarned = Math.round(dailyRate * daysPresent);
​const lateDeductions = latePunches * (clinicSettings.latePenaltyRate || 0);
const pfDeduction = Math.round(grossEarned * 0.08);
const netPay = Math.max(0, grossEarned - lateDeductions - pfDeduction);
​return {
...staff,
daysPresent,
totalDays,
dailyRate,
grossEarned,
lateDeductions,
pfDeduction,
netPay
};
});
}, [staffList, attendanceLogs, clinicSettings]);
​return (
<div className="space-y-6">
<div className="bg-gray-900 rounded-3xl p-5 border border-gray-800 shadow-md flex items-center justify-between">

function AddEditStaffModal({ staff, clinicSettings, onClose, onSave }) {
const [form, setForm] = useState({
id: staff ? staff.id : 'CK-' + Math.floor(100 + Math.random() * 900),
name: staff ? staff.name : '',
role: staff ? staff.role : 'Staff Nurse',
department: staff ? staff.department : (clinicSettings.departments ? clinicSettings.departments[0] : 'Medical OPD'),
phone: staff ? staff.phone : '',
pin: staff ? staff.pin : '1234',
baseSalary: staff ? staff.baseSalary : 35000,
assignedShift: staff ? staff.assignedShift : 'Full Day (9 AM - 6 PM)',
enrolledPhoto: staff ? staff.enrolledPhoto : 'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&q=80&w=250'
});
​const handleSubmit = (e) => {
e.preventDefault();
onSave({ ...form, baseSalary: Number(form.baseSalary) });
};
​return (
<div className="fixed inset-0 z-50 bg-gray-950/80 backdrop-blur-md flex items-center justify-center p-4">
<div className="bg-gray-900 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-gray-800">

<input required type="text" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-white" />
</div>
​<div className="grid grid-cols-2 gap-2">
<div>

</select>
</div>
<div>

​// Render React App safely
const initApp = () => {
const rootElement = document.getElementById('root');
if (rootElement && typeof ReactDOM !== 'undefined') {
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);
}
};

document.addEventListener('DOMContentLoaded', initApp);
} else {

}
